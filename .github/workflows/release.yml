name: Release

# 推送 v* 的 tag 時：編譯各平台的執行檔，上傳到 GitHub Releases（install.sh 從這裡下載）
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 用 musl 靜態連結：任何發行版都能直接跑
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: 打包
        shell: bash
        run: |
          name="rucloud-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/rucloud" LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
          "./$name/rucloud" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: rucloud-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 建立 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## ${GITHUB_REF_NAME#v} /{f=1;next} /^## /{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "rucloud $GITHUB_REF_NAME" --notes "${notes:-rucloud $GITHUB_REF_NAME}"
