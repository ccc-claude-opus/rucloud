[package]
name = "rucloud"
version = "0.13.0"
edition = "2024"
rust-version = "1.88"
description = "A self-hostable Cloudflare-Workers-like platform: Rust edge gateway + D1/KV/R2/Queues/Cron/Durable Objects/Vectorize/AI Gateway bindings, running Worker code on Node.js"
license = "MIT"
repository = "https://github.com/ccc-claude-opus/rucloud"
homepage = "https://github.com/ccc-claude-opus/rucloud"
readme = "README.md"
keywords = ["cloudflare", "workers", "serverless", "edge", "sqlite"]
categories = ["web-programming::http-server", "command-line-utilities", "database"]
include = ["/src/**/*", "/runtime/**/*", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[[bin]]
name = "rucloud"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
cron = "0.15"
futures-util = "0.3"
flate2 = "1"
hex = "0.4"
hmac = "0.12"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "service"] }
json5 = "0.4"
md-5 = "0.10"
mime_guess = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tokio", "tls12", "webpki-roots"] }
rustls-pemfile = "2"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
