# 單獨跑 app-builder：rucloud serve examples/app-builder/rucloud.toml
#   app-builder：http://localhost:8717
#   產生的 app ：http://gen-<專案id>.localhost:8700（每個專案是一個獨立的應用）
state_dir = "../../.rucloud"

[edge]
port = 8700

# 管理介面：http://127.0.0.1:8799；token 自動產生在 ../../.rucloud/admin-token
[admin]
port = 8799

# 產生的專案在執行中新增成獨立的應用；app-builder 透過 grant 拿到部署用的網址與 token
[dynamic]
grant = ["app-builder"]

[[app]]
path = "."
port = 8717
d1_init = { DB = "schema.sql" }
