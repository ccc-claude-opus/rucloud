<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rucloud chat</title>
<style>
  :root {
    --bg: #f4f4f1; --panel: #ffffff; --text: #1d1d1f; --muted: #7a7a80; --line: #e4e4e0;
    --accent: #f38020; --accent-text: #ffffff; --bubble: #ffffff; --input: #f4f4f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --panel: #1b1b1e; --text: #ececee; --muted: #94949b; --line: #2a2a2f;
      --accent: #ff8f3a; --accent-text: #1b1206; --bubble: #232327; --input: #121214;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    font: 15px/1.5 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; font-size: 18px; flex: none; }
  .title { font-weight: 650; font-size: 16px; }
  .sub { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9a9a9a; }
  .dot.on { background: #2bb24c; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .controls label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .controls input {
    font: inherit; font-size: 14px; width: 110px; padding: 5px 9px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--input); color: var(--text);
  }
  .controls button, form button {
    font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 8px; border: 0;
    background: var(--accent); color: var(--accent-text); cursor: pointer; font-weight: 600;
  }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 2px; }
  .wrap { width: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 2px; }
  .msg { display: flex; gap: 10px; align-items: flex-end; margin-top: 10px; }
  .msg.cont { margin-top: 2px; }
  .msg.cont .avatar { visibility: hidden; }
  .msg.cont .who { display: none; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; }
  .body { max-width: min(75%, 520px); display: flex; flex-direction: column; gap: 2px; }
  .who { font-size: 12px; color: var(--muted); padding-left: 4px; }
  .bubble {
    background: var(--bubble); border: 1px solid var(--line); padding: 7px 12px; border-radius: 16px 16px 16px 6px;
    white-space: pre-wrap; word-break: break-word;
  }
  .time { font-size: 11px; color: var(--muted); padding: 0 4px; }
  .msg.me { flex-direction: row-reverse; }
  .msg.me .body { align-items: flex-end; }
  .msg.me .bubble { background: var(--accent); color: var(--accent-text); border-color: transparent; border-radius: 16px 16px 6px 16px; }
  .msg.me .avatar, .msg.me .who { display: none; }
  .sys { align-self: center; margin: 10px 0 4px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 2px 10px; border-radius: 999px; }
  .empty { align-self: center; margin: auto; color: var(--muted); text-align: center; font-size: 14px; }
  form {
    display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--panel);
    border-top: 1px solid var(--line);
  }
  form .inner { width: 100%; max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  form input {
    flex: 1; font: inherit; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--input); color: var(--text); min-width: 0;
  }
  form input:focus, .controls input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  form button { border-radius: 999px; padding: 0 18px; }
  form button:disabled { opacity: .45; cursor: default; }
  @media (max-width: 560px) {
    header { padding: 8px 12px; }
    .controls { width: 100%; }
    .controls label { flex: 1; }
    .controls input { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">💬</div>
    <div>
      <div class="title" id="title">#lobby</div>
      <div class="sub"><span class="dot" id="dot"></span><span id="status">連線中…</span></div>
    </div>
  </div>
  <div class="controls">
    <label>房間 <input id="room" value="lobby" maxlength="40"></label>
    <label>暱稱 <input id="name" maxlength="20"></label>
    <button id="join">進入</button>
  </div>
</header>
<div id="log"><div class="wrap" id="list"></div></div>
<form id="f"><div class="inner"><input name="text" autocomplete="off" placeholder="說點什麼…（Enter 送出）" maxlength="2000"><button id="send">送出</button></div></form>
<script>
  // 每個房間是一個 SQLite 型 Durable Object；房間名稱放在網址的 #，可以直接分享連結
  const $ = (id) => document.getElementById(id);
  const list = $('list');
  let ws, me, lastWho = null, retry = 0, closedByUs = false;

  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  $('name').value = store.get('chat-name') || `訪客${Math.floor(Math.random() * 1000)}`;
  $('room').value = decodeURIComponent(location.hash.slice(1)) || 'lobby';

  // 依名字給固定的顏色
  const color = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) % 360; return `hsl(${h} 55% 50%)`; };
  // SQLite 的 datetime('now') 是 UTC 的 "YYYY-MM-DD HH:MM:SS"
  const time = (at) => {
    if (!at) return '';
    const d = new Date(at.includes('T') ? at : at.replace(' ', 'T') + 'Z');
    return d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  };
  const scroll = () => { $('log').scrollTop = $('log').scrollHeight; };

  function system(text) {
    const el = document.createElement('div');
    el.className = 'sys';
    el.textContent = text;
    list.append(el);
    lastWho = null;
    scroll();
  }

  function message({ name, text, at }) {
    list.querySelector('.empty')?.remove();
    const el = document.createElement('div');
    el.className = 'msg' + (name === me ? ' me' : '') + (name === lastWho ? ' cont' : '');
    el.innerHTML = '<div class="avatar"></div><div class="body"><div class="who"></div><div class="bubble"></div><div class="time"></div></div>';
    const av = el.querySelector('.avatar');
    av.textContent = [...name][0] || '?';
    av.style.background = color(name);
    el.querySelector('.who').textContent = name;
    el.querySelector('.bubble').textContent = text;
    el.querySelector('.time').textContent = time(at);
    list.append(el);
    lastWho = name;
    scroll();
  }

  function setStatus(online, text) {
    $('dot').className = 'dot' + (online ? ' on' : '');
    $('status').textContent = text;
    $('send').disabled = !online;
  }

  function join() {
    const room = $('room').value.trim() || 'lobby';
    me = $('name').value.trim() || '匿名';
    store.set('chat-name', me);
    if (decodeURIComponent(location.hash.slice(1)) !== room) history.replaceState(null, '', `#${encodeURIComponent(room)}`);
    $('title').textContent = `#${room}`;
    document.title = `#${room} · rucloud chat`;
    closedByUs = true;
    ws?.close();
    closedByUs = false;
    list.innerHTML = '';
    lastWho = null;
    setStatus(false, '連線中…');
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const sock = new WebSocket(`${proto}://${location.host}/ws?room=${encodeURIComponent(room)}&name=${encodeURIComponent(me)}`);
    ws = sock;
    sock.onopen = () => { retry = 0; };
    sock.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'history') {
        if (m.messages.length) { m.messages.forEach(message); system('以上是最近的訊息'); }
        else list.innerHTML = '<div class="empty">還沒有人說話，打個招呼吧 👋</div>';
      } else if (m.type === 'message') message(m);
      else {
        system(`${m.name} ${m.type === 'join' ? '加入' : '離開'}了`);
        setStatus(true, `線上 ${m.online} 人`);
      }
    };
    sock.onclose = () => {
      if (sock !== ws || closedByUs) return;
      setStatus(false, '連線中斷，重新連線…');
      setTimeout(() => { if (sock === ws) join(); }, Math.min(10000, 1000 * 2 ** retry++));
    };
  }

  $('join').onclick = join;
  for (const id of ['room', 'name']) $(id).onkeydown = (e) => { if (e.key === 'Enter') join(); };
  window.onhashchange = () => { const r = decodeURIComponent(location.hash.slice(1)); if (r && r !== $('room').value) { $('room').value = r; join(); } };
  $('f').onsubmit = (e) => {
    e.preventDefault();
    const t = e.target.text;
    if (ws?.readyState === 1 && t.value.trim()) { ws.send(t.value); t.value = ''; }
    t.focus();
  };
  join();
</script>
</body>
</html>
