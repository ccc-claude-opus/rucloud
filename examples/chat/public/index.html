<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rucloud chat</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  #log { border: 1px solid #ccc; height: 50vh; overflow-y: auto; padding: .5rem; }
  .sys { color: #888; }
  form { display: flex; gap: .5rem; margin-top: .5rem; }
  input[name=text] { flex: 1; }
</style>
<h1>rucloud chat</h1>
<p>房間 <input id="room" value="lobby" size="10"> 暱稱 <input id="name" size="10"> <button id="join">加入</button></p>
<div id="log"></div>
<form id="f"><input name="text" autocomplete="off" placeholder="說點什麼"><button>送出</button></form>
<script>
  let ws;
  const log = (html, cls) => { const p = document.createElement('div'); p.className = cls || ''; p.textContent = html; document.getElementById('log').append(p); p.scrollIntoView(); };
  document.getElementById('name').value = '訪客' + Math.floor(Math.random() * 1000);
  document.getElementById('join').onclick = () => {
    ws?.close();
    const room = encodeURIComponent(document.getElementById('room').value);
    const name = encodeURIComponent(document.getElementById('name').value);
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?room=${room}&name=${name}`);
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'history') m.messages.forEach((x) => log(`${x.name}：${x.text}`, 'sys'));
      else if (m.type === 'message') log(`${m.name}：${m.text}`);
      else log(`${m.name} ${m.type === 'join' ? '加入' : '離開'}了（線上 ${m.online} 人）`, 'sys');
    };
    ws.onclose = () => log('連線已關閉', 'sys');
  };
  document.getElementById('f').onsubmit = (e) => {
    e.preventDefault();
    const t = e.target.text;
    if (ws?.readyState === 1 && t.value) { ws.send(t.value); t.value = ''; }
  };
  document.getElementById('join').click();
</script>
